{% if posts %}
    {% for post in posts %}
        <div>
            <p class="text-2xl mt-4">{{ post.title }}</p>
            <p class="text-xl mb-4">{{ post.description }}</p>
            <img class="rounded-lg" src="{{ post.image }}">
            <hr class="w-3/4 my-8">
        </div>
    {% endfor %}
{% else %}
    <p>No posts available...</p>
{% endif %}
